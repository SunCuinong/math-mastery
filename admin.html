<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>错题本管理</title>
<link rel="stylesheet" href="style.css" />

  <main class="wrap">

    <div class="toolbar">
      <input id="searchInput" type="search" placeholder="搜索题目文字/知识点…" />

        <option value="new">未掌握</option>
        <option value="learning">巩固中</option>

    <div id="stats" class="stats"></div>
    <div id="list" class="q-list"></div>
  </main>

  <script src="admin.js"></script>
