<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>练习卷排版</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
</head>
<body class="paper-page">
  <header class="topbar">
    <a class="brand" href="admin.html" aria-label="Math Mastery 排版"><img src="logo.svg" alt="Math Mastery" /><span class="brand-sep">·</span><span class="brand-page">排版</span></a>
  </header>

  <main class="paper-wrap">
    <div id="paperEmpty" class="empty" hidden>还没有选择题目，请返回题库重新组卷。</div>
    <div id="paperPages" class="paper-pages" hidden></div>
  </main>

  <div id="paperActionBar" class="paper-action-bar" hidden>
    <button id="createPaperBtn" class="btn btn-primary" type="button">生成试卷</button>
  </div>

  <script src="paper.js"></script>
</body>
</html>
